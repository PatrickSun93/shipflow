name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-lint:
    name: Plugin structure lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Frontmatter on every agent + skill, agent/skill references resolve,
      # hooks point at real scripts. Stdlib Python only — ubuntu-latest
      # ships python3, so there is no install step.
      - name: Lint plugin definitions
        run: python3 scripts/lint_plugin.py

  memory-budget:
    name: Memory budget (measure.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # measure.py exits 1 if any of the five phases reads more than its
      # byte budget or touches archive/. `shell: bash` turns on pipefail,
      # so that exit code survives the tee.
      - name: Measure per-phase read budgets
        shell: bash
        run: python3 shipflow-sample/measure.py 2>&1 | tee measure.txt

      # Same table on the job summary page, so the numbers are visible
      # without opening the log.
      - name: Publish table to job summary
        if: always()
        run: |
          {
            echo '### shipflow-sample/measure.py'
            echo '```'
            cat measure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
